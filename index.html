<body>
<div id="app">
  <section id="homeScreen" class="screen">
    <header class="home-header">
      <div class="head-row"><div class="branding">سواليف <span style="font-size:19px">✦</span></div><div class="header-tools"><button class="icon-btn" aria-label="الإعدادات" data-action="settings" id="settingsBtn"></button></div></div>
      <div class="hsubtitle">محادثاتك الخيالية، على راحتك</div>
      <div class="filters"><button class="filter active" data-filter="all">المحادثات</button><button class="filter" data-filter="group">المجموعات</button><button class="filter" data-filter="person">الأفراد</button></div>
    </header>
    <div class="search-wrap"><div class="search-inner"><span id="searchIcon"></span><input type="search" id="search" autocomplete="off" placeholder="ابحث في المحادثات"></div></div>
    <main id="chatList" class="chat-list" aria-label="قائمة المحادثات"></main>
    <button id="addChat" class="fab" aria-label="محادثة أو مجموعة جديدة"></button>
  </section>
  <section id="chatScreen" class="screen hidden">
    <header class="conv-header">
      <button id="goBack" class="icon-btn" aria-label="رجوع"></button>
      <div class="titlebox" id="chatInfo" role="button" tabindex="0" aria-label="تعديل معلومات المحادثة"><div id="chatAvatar"></div><div style="min-width:0"><div class="conv-title" id="chatTitle"></div><div class="conv-sub" id="chatSubtitle"></div></div></div>
      <button id="chatOptions" class="icon-btn" aria-label="خيارات المحادثة"></button>
    </header>
    <main id="messageArea" class="message-area" aria-label="الرسائل"></main>
    <div class="sender-strip"><span>الإرسال باسم</span><select id="senderSelect" class="sender-select" aria-label="اختر مرسل الرسالة"></select></div>
    <form id="messageForm" class="composer"><div class="compose-wrap"><textarea id="messageInput" rows="1" placeholder="اكتب رسالة أو بيت شعر..." aria-label="محتوى الرسالة"></textarea><button type="button" class="icon-btn" id="attachImage" aria-label="إضافة صورة"></button></div><button type="submit" class="send-btn" aria-label="إرسال" id="sendBtn"></button></form>
  </section>
  <div id="overlay" class="overlay hidden"><div class="dialog" role="dialog" aria-modal="true"><div class="dialog-bar"></div><div id="dialogContent"></div></div></div>
  <div id="toast" class="toast hidden" role="status"></div>
  <input id="importFile" type="file" accept="application/json,.json" hidden>
  <input id="avatarFile" type="file" accept="image/*" hidden>
  <input id="messageImageFile" type="file" accept="image/*" hidden>
</div>
<script>
(()=>{
'use strict';
const KEY='sawalif_offline_v1';
const ME='__me__';
const now=()=>new Date().toISOString();
const uid=()=> (globalThis.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36)+Math.random().toString(36).slice(2));
const el=id=>document.getElementById(id);
const escapeHTML=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cssSafe=x=>String(x||'').replace(/[^a-z0-9#(),.%\s-]/gi,'');
const iconPaths={
 settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06-1.84 1.84-.06-.06A1.65 1.65 0 0 0 16 18.35a1.65 1.65 0 0 0-.92 1.5V20h-2.6v-.15A1.65 1.65 0 0 0 11 18.35a1.65 1.65 0 0 0-1.82.33l-.06.06-1.84-1.84.06-.06A1.65 1.65 0 0 0 7.65 15a1.65 1.65 0 0 0-1.5-.92H6v-2.6h.15A1.65 1.65 0 0 0 7.65 10a1.65 1.65 0 0 0-.33-1.82l-.06-.06 1.84-1.84.06.06A1.65 1.65 0 0 0 11 6.65a1.65 1.65 0 0 0 .92-1.5V5h2.6v.15a1.65 1.65 0 0 0 .92 1.5 1.65 1.65 0 0 0 1.82-.33l.06-.06 1.84 1.84-.06.06A1.65 1.65 0 0 0 18.35 10a1.65 1.65 0 0 0 1.5.92H20v2.6h-.15A1.65 1.65 0 0 0 19.4 15Z" transform="translate(-1 -1)"/>',
 plus:'<path d="M12 5v14M5 12h14"/>', back:'<path d="m9 18 6-6-6-6"/>', dots:'<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>',
 search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>', photo:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>',
 send:'<path d="m22 2-7 20-4-9-9-4 20-7Z"/><path d="M22 2 11 13"/>', check:'<path d="M20 6 9 17l-5-5"/>', checks:'<path d="m18 7-9 10-5-5M22 7 12 18"/>',
 chat:'<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5A8.5 8.5 0 0 1 21 11v.5Z"/>',
 trash:'<path d="M3 6h18M8 6V4h8v2m3 0-1 15H6L5 6M10 10v7M14 10v7"/>', close:'<path d="M18 6 6 18M6 6l12 12"/>', edit:'<path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L9 17l-4 1 1-4Z"/>', users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M16 3a4 4 0 0 1 0 8M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/>',
 archive:'<rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v12h14V8M10 12h4"/>'};
const I=name=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${iconPaths[name]||iconPaths.chat}</svg>`;
let app={version:1,me:'أنت',dark:false,chats:[]},view='home',selected=null,filter='all',search='',senderByChat={},modal=null,avatarDraft='💬',avatarPhotoDraft='',editingMessage=null,toastTimer=null;
function sample(){const t=Date.now();const time=n=>new Date(t-n*60000).toISOString();return {version:1,me:'أنت',dark:false,chats:[
{id:uid(),type:'group',name:'ديوانية القصيد',avatar:'☕',photo:'',participants:['نواف','مشاري','فهد'],createdAt:time(70),messages:[{id:uid(),sender:'نواف',text:'يا جماعة الليلة عندي بيتين، أبي رأيكم 😄',at:time(42)},{id:uid(),sender:ME,text:'هات اللي عندك، نسمعك',at:time(38)},{id:uid(),sender:'مشاري',text:'الله الله، نبي قصيد يطرب ✨',at:time(31)}]},
{id:uid(),type:'person',name:'سالم',avatar:'🌄',photo:'',participants:['سالم'],createdAt:time(120),messages:[{id:uid(),sender:'سالم',text:'بشّر، كتبت القصيدة؟',at:time(85)},{id:uid(),sender:ME,text:'باقي الشطر الأخير.',at:time(64)}]}
]};}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const data=JSON.parse(raw); if(data&&Array.isArray(data.chats)){app=normalize(data);return;}}}catch(e){console.warn('read error',e)}app=sample();save();}
function normalize(d){return {version:1,me:String(d.me||'أنت').slice(0,55),dark:!!d.dark,chats:d.chats.slice(0,500).map(c=>({id:String(c.id||uid()),type:c.type==='group'?'group':'person',name:String(c.name||'محادثة').slice(0,100),avatar:String(c.avatar||'💬').slice(0,8),photo:validImg(c.photo)?c.photo:'',participants:(Array.isArray(c.participants)?c.participants:[]).filter(n=>typeof n==='string').map(n=>n.slice(0,80)).slice(0,60),createdAt:validDate(c.createdAt),messages:(Array.isArray(c.messages)?c.messages:[]).slice(0,6000).map(m=>({id:String(m.id||uid()),sender:typeof m.sender==='string'?m.sender.slice(0,80):ME,text:String(m.text||'').slice(0,10000),image:validImg(m.image)?m.image:'',at:validDate(m.at),edited:!!m.edited}))}))};}
function validImg(s){return typeof s==='string' && /^data:image\/(png|jpeg|webp);base64,[\w+/=]+$/i.test(s) && s.length < 1000000;}
function validDate(s){const d=new Date(s);return isNaN(d.getTime())?now():d.toISOString();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(app));return true;}catch(e){toast('المساحة ممتلئة أو الحفظ غير متاح. صدّر نسخة احتياطية، ثم احذف الصور الكبيرة.');return false;}}
function toast(s){const n=el('toast');n.textContent=s;n.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.add('hidden'),3500);}
function getChat(){return app.chats.find(c=>c.id===selected);}
function lastTime(c){return c.messages.length?c.messages[c.messages.length-1].at:c.createdAt;}
function time(s){try{return new Intl.DateTimeFormat('ar-SA',{hour:'numeric',minute:'2-digit'}).format(new Date(s));}catch{return ''}}
function listTime(s){let d=new Date(s),t=new Date();if(d.toDateString()===t.toDateString())return time(s);return new Intl.DateTimeFormat('ar-SA',{month:'numeric',day:'numeric'}).format(d);}
function day(s){let d=new Date(s),t=new Date(),y=new Date();y.setDate(t.getDate()-1);if(d.toDateString()===t.toDateString())return 'اليوم';if(d.toDateString()===y.toDateString())return 'أمس';return new Intl.DateTimeFormat('ar-SA',{day:'numeric',month:'long',year:'numeric'}).format(d);}
function avatar(c,small=false){let inner=c.photo&&validImg(c.photo)?`<img src="${c.photo}" alt="">`:escapeHTML(c.avatar||'💬');return `<span class="avatar${small?' small':''}">${inner}</span>`;}
function renderList(){let chats=[...app.chats].sort((a,b)=>new Date(lastTime(b))-new Date(lastTime(a))).filter(c=>(filter==='all'||c.type===filter)&&(!search||(`${c.name} ${c.participants.join(' ')} ${c.messages.at(-1)?.text||''}`).toLocaleLowerCase().includes(search.toLocaleLowerCase())));el('chatList').innerHTML=chats.length?chats.map(c=>{let m=c.messages.at(-1),preview=m?`${m.sender===ME?'أنت':m.sender}: ${m.text||'📷 صورة'}`:'ابدأ المحادثة...';return `<button class="chat-row" data-open="${escapeHTML(c.id)}">${avatar(c)}<span class="chat-middle"><span class="chat-name">${escapeHTML(c.name)}${c.type==='group'?' <span style="font-size:12px;color:var(--sub)">◉</span>':''}</span><span class="chat-preview">${escapeHTML(preview)}</span></span><span class="chat-side"><span>${escapeHTML(listTime(lastTime(c)))}</span><span class="tiny-pill"></span></span></button>`;}).join(''):`<div class="empty"><span class="empty-graphic">${I('chat')}</span><strong>${search?'ما لقيت محادثة بهذا الاسم':'المحادثات عندك فاضية'}</strong><p>${search?'جرّب كلمة مختلفة':'اضغط الزر الأخضر لإنشاء محادثة خاصة أو مجموعة خيالية.'}</p></div>`;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));}
function showHome(){view='home';selected=null;el('chatScreen').classList.add('hidden');el('homeScreen').classList.remove('hidden');renderList();history.replaceState({view:'home'},'',location.pathname+location.search+location.hash);}
function openChat(id,push=true){if(!app.chats.some(c=>c.id===id))return;view='chat';selected=id;el('homeScreen').classList.add('hidden');el('chatScreen').classList.remove('hidden');renderConversation();el('messageInput').value='';if(push)history.pushState({view:'chat',id},'','#chat-'+encodeURIComponent(id));}
function participants(c){return [ME,...c.participants];}
function renderConversation(scroll=true){let c=getChat();if(!c)return showHome();el('chatTitle').textContent=c.name;el('chatAvatar').innerHTML=avatar(c,true);el('chatSubtitle').textContent=c.type==='group'?`${c.participants.length+1} مشاركين • اضغط للتعديل`:'اضغط لتعديل المحادثة';let sel=el('senderSelect'),current=senderByChat[c.id]||ME;sel.innerHTML=participants(c).map(n=>`<option value="${escapeHTML(n)}">${escapeHTML(n===ME?app.me:n)}</option>`).join('');if(!participants(c).includes(current))current=ME;sel.value=current;senderByChat[c.id]=current;let prevDay='';let html='';[...c.messages].sort((a,b)=>new Date(a.at)-new Date(b.at)).forEach(m=>{const d=new Date(m.at).toDateString();if(d!==prevDay){prevDay=d;html+=`<div class="day-label">${escapeHTML(day(m.at))}</div>`;}let mine=m.sender===ME;html+=`<div class="msg-row ${mine?'mine':'other'}"><button type="button" class="bubble" data-msg="${escapeHTML(m.id)}" aria-label="خيارات الرسالة">${(!mine&&c.type==='group')?`<span class="sender-name">${escapeHTML(m.sender)}</span>`:''}${m.image&&validImg(m.image)?`<img class="msg-image" src="${m.image}" alt="صورة ضمن الرسالة">`:''}${m.text?`<span class="msg-text" dir="auto">${escapeHTML(m.text)}</span>`:''}<span class="msg-meta"><span>${escapeHTML(time(m.at))}${m.edited?' · معدّلة':''}</span>${mine?`<span class="checks">${I('checks')}</span>`:''}</span></button></div>`;});el('messageArea').innerHTML=html||`<div class="empty" style="padding-top:80px"><strong>بداية المحادثة</strong><p>اكتب باسمك، أو اختر اسم الطرف الثاني من قائمة «الإرسال باسم».</p></div>`;if(scroll){requestAnimationFrame(()=>{el('messageArea').scrollTop=el('messageArea').scrollHeight;});}}
function sendMessage(text,image=''){let c=getChat();if(!c||(!text.trim()&&!image))return;let sender=el('senderSelect').value||ME;c.messages.push({id:uid(),sender,text:text.trim(),image,at:now()});save();renderConversation();el('messageInput').value='';resizeText();}
function resizeText(){let a=el('messageInput');a.style.height='auto';a.style.height=Math.min(a.scrollHeight,110)+'px';}
function modalOpen(markup,onReady){el('dialogContent').innerHTML=markup;el('overlay').classList.remove('hidden');modal=true;if(onReady)onReady();}
function modalClose(){el('overlay').classList.add('hidden');el('dialogContent').innerHTML='';modal=null;editingMessage=null;}
function header(s){return `<div class="dialog-head"><h2>${escapeHTML(s)}</h2><button type="button" class="icon-btn" data-close aria-label="إغلاق">${I('close')}</button></div>`;}
function newChatModal(kind='person'){avatarDraft=kind==='group'?'👥':'🙂';avatarPhotoDraft='';modalOpen(header('محادثة جديدة')+`<div class="seg-row"><button class="seg ${kind==='person'?'selected':''}" id="typePerson">محادثة فردية</button><button class="seg ${kind==='group'?'selected':''}" id="typeGroup">مجموعة</button></div><form id="createForm"><label class="form-field"><span class="form-label" id="nameLabel">${kind==='group'?'اسم المجموعة':'اسم الشخص'}</span><input class="field" id="newName" maxlength="90" autocomplete="off" placeholder="${kind==='group'?'مثل: قروب الشعراء':'مثل: نواف'}" required></label>${kind==='group'?`<label class="form-field"><span class="form-label">أسماء المشاركين</span><textarea class="field-textarea" id="newPeople" placeholder="نواف، فهد، مشاري" required></textarea><div class="field-hint">افصل الأسماء بفاصلة عربية أو إنجليزية أو اكتب كل اسم في سطر.</div></label>`:''}<label class="form-field"><span class="form-label">رمز المحادثة أو المجموعة (اختياري)</span><input class="field" id="newAvatar" maxlength="8" value="${escapeHTML(avatarDraft)}" placeholder="☕"></label><button type="button" id="newPhotoButton" class="secondary" style="margin-bottom:12px">اختيار صورة للملف الشخصي</button><div id="photoPreview" class="field-hint"></div><button type="submit" class="primary" style="width:100%">إنشاء وفتح المحادثة</button></form>`,()=>{el('newName').focus();el('typePerson').onclick=()=>newChatModal('person');el('typeGroup').onclick=()=>newChatModal('group');el('newPhotoButton').onclick=()=>el('avatarFile').click();el('createForm').onsubmit=e=>{e.preventDefault();let name=el('newName').value.trim();if(!name)return;let people=kind==='group'?splitNames(el('newPeople').value):[name];if(kind==='group'&&!people.length){toast('أضف اسم مشارك واحد على الأقل');return;}let chat={id:uid(),type:kind,name,avatar:el('newAvatar').value.trim()||'💬',photo:avatarPhotoDraft,participants:people,createdAt:now(),messages:[]};app.chats.push(chat);save();modalClose();openChat(chat.id);};});}
function splitNames(s){return [...new Set(s.split(/[,،\n]+/).map(x=>x.trim()).filter(Boolean))].slice(0,60);}
function editChatModal(){let c=getChat();if(!c)return;avatarPhotoDraft=c.photo||'';modalOpen(header('معلومات المحادثة')+`<form id="editChatForm"><label class="form-field"><span class="form-label">${c.type==='group'?'اسم المجموعة':'اسم الشخص'}</span><input class="field" id="editName" value="${escapeHTML(c.name)}" maxlength="90" required></label><label class="form-field"><span class="form-label">الرمز</span><input class="field" id="editAvatar" maxlength="8" value="${escapeHTML(c.avatar)}"></label><button type="button" class="secondary" id="changePhoto">${c.photo?'تغيير الصورة':'إضافة صورة'} </button>${c.photo?` <button type="button" class="secondary" id="removePhoto">إزالة الصورة</button>`:''}<label class="form-field" style="margin-top:14px"><span class="form-label">${c.type==='group'?'المشاركون (افصل بينهم بفاصلة أو سطر)':'اسم الطرف الآخر'}</span><textarea class="field-textarea" id="editParticipants">${escapeHTML(c.participants.join('، '))}</textarea></label><div class="form-actions"><button type="submit" class="primary">حفظ التعديلات</button><button type="button" class="secondary" data-close>إلغاء</button></div></form>`,()=>{el('changePhoto').onclick=()=>el('avatarFile').click();if(el('removePhoto'))el('removePhoto').onclick=()=>{avatarPhotoDraft='';el('removePhoto').textContent='ستُزال الصورة بعد الحفظ';};el('editChatForm').onsubmit=e=>{e.preventDefault();let names=splitNames(el('editParticipants').value),old=c.participants;c.name=el('editName').value.trim()||c.name;c.avatar=el('editAvatar').value.trim()||'💬';c.photo=avatarPhotoDraft;c.participants=names.length?names:old;if(c.type==='person'&&c.participants.length>1)c.participants=c.participants.slice(0,1);save();modalClose();renderConversation(false);};});}
function chatMenu(){let c=getChat();if(!c)return;modalOpen(header(c.name)+`<button class="action-line" id="editChatAction">${I('edit')} تعديل الاسم والمشاركين والصورة</button><button class="action-line" id="clearChatAction">${I('trash')} تفريغ جميع الرسائل</button><button class="action-line danger-text" id="deleteChatAction">${I('trash')} حذف المحادثة بالكامل</button>`,()=>{el('editChatAction').onclick=()=>editChatModal();el('clearChatAction').onclick=()=>confirmAction('تفريغ المحادثة','ستُحذف كل الرسائل داخل هذه المحادثة فقط.','تفريغ',()=>{c.messages=[];save();renderConversation();});el('deleteChatAction').onclick=()=>confirmAction('حذف المحادثة','سيُحذف اسم المحادثة وكل رسائلها.','حذف نهائي',()=>{app.chats=app.chats.filter(x=>x.id!==c.id);save();showHome();});});}
function confirmAction(title,desc,label,fn){modalOpen(header(title)+`<p class="footnote">${escapeHTML(desc)}</p><div class="form-actions"><button id="confirmYes" class="danger">${escapeHTML(label)}</button><button class="secondary" data-close>إلغاء</button></div>`,()=>{el('confirmYes').onclick=()=>{modalClose();fn();};});}
function messageMenu(id){let c=getChat(),m=c?.messages.find(m=>m.id===id);if(!m)return;editingMessage=id;modalOpen(header('خيارات الرسالة')+`<div class="footnote" style="background:var(--input);padding:10px;border-radius:10px;max-height:90px;overflow:auto">${escapeHTML((m.text||'📷 صورة').slice(0,280))}</div><button id="msgEdit" class="action-line">${I('edit')} تعديل الرسالة والوقت</button><button id="msgCopy" class="action-line">نسخ النص</button><button id="msgDelete" class="action-line danger-text">${I('trash')} حذف الرسالة</button>`,()=>{el('msgEdit').onclick=()=>editMessageModal(id);el('msgCopy').onclick=async()=>{let txt=m.text;if(navigator.clipboard?.writeText){try{await navigator.clipboard.writeText(txt);toast('تم نسخ النص');}catch{toast('النسخ غير متاح هنا');}}else toast('النسخ غير متاح في هذا المتصفح');modalClose();};el('msgDelete').onclick=()=>{c.messages=c.messages.filter(x=>x.id!==id);save();modalClose();renderConversation();};});}
function localDateValue(iso){let d=new Date(iso),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;}
function editMessageModal(id){let c=getChat(),m=c?.messages.find(x=>x.id===id);if(!m)return;modalOpen(header('تعديل الرسالة')+`<form id="editMsgForm"><label class="form-field"><span class="form-label">المرسل</span><select id="msgSender" class="field-select">${participants(c).map(n=>`<option value="${escapeHTML(n)}" ${n===m.sender?'selected':''}>${escapeHTML(n===ME?app.me:n)}</option>`).join('')}</select></label><label class="form-field"><span class="form-label">النص</span><textarea class="field-textarea" id="msgText" rows="4">${escapeHTML(m.text)}</textarea></label><label class="form-field"><span class="form-label">التاريخ والوقت</span><input type="datetime-local" class="field" id="msgTime" value="${localDateValue(m.at)}"></label><div class="form-actions"><button type="submit" class="primary">حفظ الرسالة</button><button type="button" class="secondary" data-close>إلغاء</button></div></form>`,()=>{el('editMsgForm').onsubmit=e=>{e.preventDefault();let s=el('msgText').value;if(!s.trim()&&!m.image){toast('الرسالة فارغة');return;}m.sender=el('msgSender').value;m.text=s.trim();let t=new Date(el('msgTime').value);if(!isNaN(t.getTime()))m.at=t.toISOString();m.edited=true;save();modalClose();renderConversation();};});}
function settingsModal(){modalOpen(header('الإعدادات')+`<label class="form-field"><span class="form-label">اسمك الذي يظهر في الرسائل</span><input class="field" id="myName" value="${escapeHTML(app.me)}" maxlength="55"></label><label class="check-row"><input type="checkbox" id="darkSwitch" ${app.dark?'checked':''}><span>الوضع الداكن</span></label><button class="primary" id="saveSettings" style="width:100%;margin-bottom:13px">حفظ الإعدادات</button><div class="section-title">البيانات المحلية</div><button class="action-line" id="exportBtn">${I('archive')} تصدير نسخة احتياطية (JSON)</button><button class="action-line" id="importBtn">${I('archive')} استيراد نسخة احتياطية</button><button class="action-line danger-text" id="wipeBtn">${I('trash')} حذف جميع المحادثات والبدء من الصفر</button><p class="footnote">تُحفظ رسائلك داخل هذا المتصفح على جهازك، ولا تُرسل إلى خادم. احفظ نسخة احتياطية من وقت لآخر، خصوصًا قبل مسح بيانات Safari. هذه أداة محادثات خيالية وليست متصلة بواتساب.</p>`,()=>{el('saveSettings').onclick=()=>{app.me=el('myName').value.trim()||'أنت';app.dark=el('darkSwitch').checked;setTheme();save();modalClose();toast('تم حفظ الإعدادات');};el('exportBtn').onclick=exportData;el('importBtn').onclick=()=>{modalClose();el('importFile').click();};el('wipeBtn').onclick=()=>confirmAction('حذف جميع البيانات','سيتم حذف كل المجموعات والمحادثات والرسائل. يمكنك استعادة نسخة احتياطية إن كانت محفوظة.','احذف الكل',()=>{app.chats=[];save();showHome();});});}
function setTheme(){document.body.classList.toggle('dark',app.dark);document.querySelector('meta[name="theme-color"]').setAttribute('content',app.dark?'#182d2a':'#075e54');}
function exportData(){const blob=new Blob([JSON.stringify(app,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=`سواليف-نسخة-احتياطية-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('تم تجهيز النسخة الاحتياطية. احفظ الملف في «الملفات».');}
async function importData(file){if(!file)return;try{if(file.size>15*1024*1024)throw Error('الحجم كبير');let d=JSON.parse(await file.text());if(!d||!Array.isArray(d.chats)||d.version!==1)throw Error('صيغة غير متوافقة');let normalized=normalize(d);if(!confirm(`استيراد ${normalized.chats.length} محادثة؟ هذا سيستبدل بياناتك الحالية.`))return;app=normalized;setTheme();save();showHome();toast('تم استيراد البيانات');}catch(e){toast('تعذر قراءة الملف. تأكد أنه نسخة سواليف بصيغة JSON.');}el('importFile').value='';}
function imageToData(file,max=720,q=.68){return new Promise((resolve,reject)=>{if(!file?.type.startsWith('image/'))return reject(Error('نوع غير مدعوم'));if(file.size>25*1024*1024)return reject(Error('حجم الصورة كبير'));let reader=new FileReader();reader.onerror=reject;reader.onload=()=>{let img=new Image();img.onerror=reject;img.onload=()=>{let scale=Math.min(1,max/Math.max(img.width,img.height));let cv=document.createElement('canvas');cv.width=Math.max(1,Math.floor(img.width*scale));cv.height=Math.max(1,Math.floor(img.height*scale));let ctx=cv.getContext('2d');ctx.drawImage(img,0,0,cv.width,cv.height);resolve(cv.toDataURL('image/jpeg',q));};img.src=reader.result;};reader.readAsDataURL(file);});}
function init(){load();setTheme();el('settingsBtn').innerHTML=I('settings');el('searchIcon').innerHTML=I('search');el('addChat').innerHTML=I('plus');el('goBack').innerHTML=I('back');el('chatOptions').innerHTML=I('dots');el('attachImage').innerHTML=I('photo');el('sendBtn').innerHTML=I('send');renderList();
 el('settingsBtn').onclick=settingsModal;el('addChat').onclick=()=>newChatModal();el('search').oninput=e=>{search=e.target.value;renderList();};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderList();});el('chatList').onclick=e=>{let b=e.target.closest('[data-open]');if(b)openChat(b.dataset.open);};el('goBack').onclick=showHome;el('chatOptions').onclick=chatMenu;el('chatInfo').onclick=editChatModal;el('chatInfo').onkeydown=e=>{if(e.key==='Enter')editChatModal();};el('senderSelect').onchange=e=>{if(selected)senderByChat[selected]=e.target.value;};el('messageForm').onsubmit=e=>{e.preventDefault();sendMessage(el('messageInput').value);};el('messageInput').oninput=resizeText;el('messageInput').onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();sendMessage(e.target.value);}};el('messageArea').onclick=e=>{let m=e.target.closest('[data-msg]');if(m)messageMenu(m.dataset.msg);};
 el('overlay').onclick=e=>{if(e.target===el('overlay')||e.target.closest('[data-close]'))modalClose();};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)modalClose();});el('importFile').onchange=e=>importData(e.target.files?.[0]);el('avatarFile').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;try{avatarPhotoDraft=await imageToData(f,220,.74);if(el('photoPreview'))el('photoPreview').textContent='✓ تم اختيار صورة للمحادثة';toast('تم تجهيز الصورة، اضغط حفظ');}catch{toast('تعذر تحميل الصورة');}e.target.value='';};el('attachImage').onclick=()=>el('messageImageFile').click();el('messageImageFile').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;try{let image=await imageToData(f,700,.65);sendMessage(el('messageInput').value,image);}catch{toast('تعذر إرفاق هذه الصورة');}e.target.value='';};
 window.addEventListener('popstate',e=>{if(modal){modalClose();return;}if(e.state?.view==='chat'&&app.chats.some(c=>c.id===e.state.id))openChat(e.state.id,false);else if(view==='chat'){view='home';selected=null;el('chatScreen').classList.add('hidden');el('homeScreen').classList.remove('hidden');renderList();}});
 if('serviceWorker' in navigator && location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
init();
})();
</script>
